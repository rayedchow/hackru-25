name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.lock
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: ruff format --check backend/synapse_memory backend/server.py backend/dashboard.py tests scripts frontend/brainApp/screenshot_app.py
      - run: ruff check backend/synapse_memory backend/server.py backend/dashboard.py tests scripts frontend/brainApp/screenshot_app.py
      - run: mypy backend/synapse_memory backend/server.py backend/dashboard.py
      - name: Scan added lines for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/scan_secrets.py --base "$BASE_SHA"
      - run: pytest --cov=synapse_memory --cov-report=term-missing --cov-fail-under=90
      - if: matrix.python-version == '3.12'
        run: python -m build
      - run: synapse-memory --help

  capture-source-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test tests-js/*.test.mjs
